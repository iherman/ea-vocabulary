# TODO: All the back links to the specification must be updated. It also depends on whether the
# the generated text becomes an appendix or not
#
# For individual restrictions, the OA approach was to use individuals in a class; for color/highlight the somewhat simpler
# approach of using string restrictions was chosen. We may consider doing the same as OA for consistency...

json_ld:
    alias:
        "language"  : "@language"
        "direction" : "@direction"
        "id"        : "@id"
        "type"      : "@type"
        "value"     : "@value"
    import: "http://www.w3.org/ns/anno.jsonld"

vocab:
    - id: ea
      value: https://www.w3.org/ns/epub/annotation/vocabulary#
      context: https://www.w3.org/ns/epub/anno.jsonld

prefix:
    - id: oa
      value: http://www.w3.org/ns/oa#

    - id: as
      value: http://www.w3.org/ns/activitystreams#

    - id: foaf
      value: http://xmlns.com/foaf/0.1/

ontology:
    - property: dc:title
      value: EPUB Annotations vocabulary

    - property: dc:description
      value: RDFS [[RDF-SCHEMA]] vocabulary used by the EPUB Annotation, as a profile of the W3C Web Annotation vocabulary.

    - property: rdfs:seeAlso
      value: https://w3c.github.io/epub-specs/epub34/annotations/

class:
    - id: About
      label: Information about the publication
      comment: The (externally defined) Dublin Core terms are used with this class, retaining the prefixes (to be in line with the EPUB Package Document)
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-2-about

    - id: Annotation
      label: EPUB Annotation Object
      upper_value: oa:Annotation
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-1-annotation-object
      comment: The Annotation object of EPUB Annotation; the list of acceptable properties are restricted compared to the Web Annotation version.

    - id: AnnotationSet
      label: Set of annotations
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

    - id: Body
      label: Body of an Annotation
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body
      upper_value: oa:TextualBody
      comment: In EPUB,  annotations are restricted to textual content.

    - id: Creator
      label: Creator of an Annotation
      upper_value: [foaf:Person, foaf:Organization, as:Application]
      upper_union: true
      comment: The context file contains aliases for the possible creator values, JSON-LD serializations can simply use the terms <code>Person</code>, <code>Organization</code>, or <code>Software</code>.
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-2-creator

    - id: Meta
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target
      comment: this class is currently undefined...

    - id: Generator
      label: Information about the tools generating the annotations
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-1-generator

    - id: Motivation
      label: A restrictive subset of Open Annotation's Motivations
      upper_value: oa:Motivation
      one_of: [oa:bookmarking, oa:commenting, oa:highlighting]
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-1-annotation-object

    - id: Selector
      label: A restrictive subset of selectors, used in EPUB
      upper_value: [oa:FragmentSelector, oa:CssSelector, oa:TextQuoteSelector]
      upper_union: true
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target
      comment: The final list of selectors for EPUB is still to be defined, this is only a placeholder for now.

    - id: Target
      label: Target of an Annotation
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target

property:
    - id: about
      label: Information on the publication
      domain: AnnotationSet
      range: About
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

    - id: hasBody
      label: The body of an annotation
      upper_value: oa:hasBody
      domain: Annotation
      range: Body
      known_as: body
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body
      comment: The context file "shadows" the <code>body</code> term in the Web Annotation context file, restricting its range.

    - id: color
      domain: Body
      range: Color
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body

    - id: creator
      label: The creator of an annotation
      upper_value: dcterms:creator
      range: Creator
      comment: The usage of the Dublin Core's <code>dcterm</code> value is restricted to certain type of values...
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-1-annotation-object

    - id: generator
      domain: AnnotationSet
      range: Generator
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set
      comment: The context file "shadows" the <code>generator</code> term in the Web Annotation context file, restricting its range; see formal definition for the restrictions.

    - id: highlight
      domain: Body
      range: Highlight
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body

    - id: foaf:homepage
      range: URL
      comment: In the generated JSON-LD context file this term appears as "<code>homepage</code>".
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body

    - id: items
      label: The reference to the set of annotations
      domain: AnnotationSet
      range: Annotation
      container: set
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

    - id: meta
      domain: Target
      range: Meta
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target

    - id: motivatedBy
      label: The motivation for an annotation
      upper_value: oa:motivatedBy
      known_as: motivation
      domain: Annotation
      range: Motivation
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-1-annotation-object
      comment: The context file "shadows" the <code>body</code> term in the Web Annotation context file, restricting its range.

    - id: name
      domain: [Creator, Generator]
      range: xsd:string
      upper_value: foaf:name
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set
      comment: This property restricts the usage of <code>foaf:name</code> to be used on creators.

    - id: hasSelector
      upper_value: oa:hasSelector
      label: Assign selector(s) to a target
      range: Selector
      known_as: selector
      comment: The range of this subproperty represents a subset of the Selectors, as defined by the Open Annotation specification.
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target

    - id: hasSource
      upper_value: oa:hasSource
      domain: Target
      range: URL
      known_as: source
      comment: The context file "shadows" the <code>source</code> term in the Web Annotation context file, restricting its domain and controlling its alias name.
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target

    - id: tags
      domain: Body
      range: xsd:string
      container: set
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-4-body

    - id: hasTarget
      label: The target of an annotation
      upper_value: oa:hasTarget
      domain: Annotation
      range: Target
      known_as: target
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#1-3-target
      comment: The context file "shadows" the <code>target</code> term in the Web Annotation context file, restricting its range.

    - id: hasTitle
      label: Title of the Annotation Set
      domain: AnnotationSet
      range: xsd:string
      known_as: title
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

datatype:
    - id: Color
      type: xsd:string
      one_of: [pink, orange, yellow, green, blue, purple ]
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

    - id: Highlight
      type: xsd:string
      one_of: [solid, underline, strikethrough, outline]
      defined_by: https://w3c.github.io/epub-specs/epub34/annotations/#2-annotation-set

